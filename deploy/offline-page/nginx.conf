server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # Never let the offline page get cached — the app might be back in
    # seconds and we don't want browsers holding onto the 504.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    # Logo: 200 OK. Referenced by the offline page's <img>; browsers
    # fetch it as a subresource, so this location must succeed.
    location = /noctalum.png {
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files /noctalum.png =404;
    }

    # Everything else: serve the branded offline page with a real 504.
    # `return 504` sets the status; `error_page 504 /index.html` serves
    # our HTML in its place while preserving the status code.
    error_page 504 /index.html;
    location = /index.html {
        internal;
    }
    location / {
        return 504;
    }
}
